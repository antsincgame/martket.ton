# Стек web + api для Coolify или локального docker compose.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APPWRITE_ENDPOINT: ${VITE_APPWRITE_ENDPOINT}
        VITE_APPWRITE_PROJECT_ID: ${VITE_APPWRITE_PROJECT_ID}
        VITE_COMMERCE_API_URL: ${VITE_COMMERCE_API_URL:-/api}
        VITE_TONFORGE_API_URL: ${VITE_TONFORGE_API_URL:-/api/tonforge}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_ORIGIN: ${VITE_APP_ORIGIN}
    ports:
      - "8092:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-8081}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tonforge.org}
      SENTRY_DSN: ${SENTRY_DSN:-}
      HEALTH_DETAIL_TOKEN: ${HEALTH_DETAIL_TOKEN:-}
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      TREASURY_WALLET_ADDRESS: ${TREASURY_WALLET_ADDRESS}
      TONAPI_KEY: ${TONAPI_KEY}
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io/v2}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-1500}
      TRIAL_WINDOW_SEC: ${TRIAL_WINDOW_SEC:-259200}
      COMMERCE_ADMIN_SECRET: ${COMMERCE_ADMIN_SECRET}
      BOOTSTRAP_SELLER_WALLET: ${BOOTSTRAP_SELLER_WALLET}
      COMMERCE_JETTON_MASTER: ${COMMERCE_JETTON_MASTER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_MAX_BUILD_MB: ${R2_MAX_BUILD_MB:-100}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_THRESHOLD_MALICIOUS: ${VIRUSTOTAL_THRESHOLD_MALICIOUS:-1}
      VIRUSTOTAL_THRESHOLD_SUSPICIOUS: ${VIRUSTOTAL_THRESHOLD_SUSPICIOUS:-3}
      TON_NETWORK: ${TON_NETWORK:-testnet}
      TON_API_ENDPOINT: ${TON_API_ENDPOINT}
      TON_API_KEY: ${TON_API_KEY}
      ORACLE_MNEMONIC: ${ORACLE_MNEMONIC}
      LICENSE_NFT_ITEM_CODE_BOC: ${LICENSE_NFT_ITEM_CODE_BOC}
      APP_COLLECTION_CODE_BOC: ${APP_COLLECTION_CODE_BOC}
      LICENSE_MINT_GAS_NANO: ${LICENSE_MINT_GAS_NANO:-150000000}
      LICENSE_BURN_GAS_NANO: ${LICENSE_BURN_GAS_NANO:-70000000}
    ports:
      - "8093:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://localhost:8081/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

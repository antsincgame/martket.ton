name: CI

# Why this layout:
#   - quality, contracts, build run in parallel for fast PR feedback (~3-4 min total)
#   - e2e is gated behind workflow_dispatch / push to main because it needs a
#     real backend with Appwrite secrets — running it on every PR from a fork
#     would either fail noisily or leak secrets
#   - all jobs use a tight cache strategy: setup-node caches every npm folder
#     by passing all package-lock.json paths

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── 1. Code quality (lint + typecheck + unit tests) ──────────────
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # Backend deps must be installed before vitest runs — the unit tests
      # in backend/**/*.test.ts import @ton/ton, node-appwrite, etc. which
      # only live in backend/node_modules.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Unit tests (Vitest, frontend + backend)
        run: npm test -- --reporter=default

  # ─── 2. Smart contracts (Tact build + sandbox tests) ──────────────
  contracts:
    name: Tact build · Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci --no-audit --no-fund

      - name: Build Tact contracts
        working-directory: contracts
        run: npm run build

      - name: Contract sandbox tests
        working-directory: contracts
        run: npm test

      # Build artifacts are gitignored but useful as an artifact for inspection.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tact-build-${{ github.sha }}
          path: contracts/build/
          retention-days: 7
          if-no-files-found: ignore

  # ─── 3. Production build verification ─────────────────────────────
  build:
    name: Vite production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Build-time public env. Without these the bundle contains
          # `undefined` placeholders — fine for type checking but the
          # resulting bundle would 404 against Appwrite.
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: ci-build
          VITE_COMMERCE_API_URL: http://localhost:8081

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─── 4. Aggregate "all checks passed" gate (use as required check) ─
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, contracts, build]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.contracts.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"

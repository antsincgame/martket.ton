name: Regen Lockfile
on:
  push:
    paths:
      - '.github/regen.trigger'

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read trigger config
        id: cfg
        run: |
          workdir=$(sed -n '1p' .github/regen.trigger || echo "")
          echo "workdir=$workdir" >> $GITHUB_OUTPUT
          echo "Workdir: '$workdir'"
      - name: Regenerate lockfile
        working-directory: ${{ steps.cfg.outputs.workdir == '' && '.' || steps.cfg.outputs.workdir }}
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --include=optional --no-audit --no-fund
      - name: Verify npm ci
        working-directory: ${{ steps.cfg.outputs.workdir == '' && '.' || steps.cfg.outputs.workdir }}
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Commit lockfile and delete trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "${{ steps.cfg.outputs.workdir }}" ]; then
            lockfile="package-lock.json"
          else
            lockfile="${{ steps.cfg.outputs.workdir }}/package-lock.json"
          fi
          rm -f .github/regen.trigger
          rm -f .github/workflows/regen-lockfile.yml
          git add "$lockfile" .github/regen.trigger .github/workflows/regen-lockfile.yml
          git commit -m "chore: regenerate $lockfile on Linux [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

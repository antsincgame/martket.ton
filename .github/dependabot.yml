version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      prod-deps:
        dependency-type: production
        update-types: [minor, patch]
      dev-deps:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      backend-deps:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      contracts-deps:
        update-types: [minor, patch]
    labels: [dependencies, contracts]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

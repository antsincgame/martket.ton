version: 2
# Weekly dependency upgrades. We group minor + patch into a single PR per
# ecosystem to avoid PR spam — major bumps still come as their own PR
# (and require human review because they break things).

updates:
  # Frontend (root)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  # Backend
  - package-ecosystem: npm
    directory: '/backend'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  # Tact contracts
  - package-ecosystem: npm
    directory: '/contracts'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - contracts
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'

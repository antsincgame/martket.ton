# SPA + динамический TON Connect manifest, чтобы кошелёк всегда видел текущий домен деплоя.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $tonconnect_host $host;
    set $tonconnect_proto $scheme;

    if ($http_x_forwarded_host != "") {
        set $tonconnect_host $http_x_forwarded_host;
    }

    if ($http_x_forwarded_proto != "") {
        set $tonconnect_proto $http_x_forwarded_proto;
    }

    location = /tonconnect-manifest.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 200 '{"url":"$tonconnect_proto://$tonconnect_host","name":"TON Web Store","iconUrl":"$tonconnect_proto://$tonconnect_host/app-icon.png","termsOfUseUrl":"$tonconnect_proto://$tonconnect_host/","privacyPolicyUrl":"$tonconnect_proto://$tonconnect_host/"}';
    }

    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

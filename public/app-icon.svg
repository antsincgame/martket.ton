<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#0D2137"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="50%" stop-color="#0098EA"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0098EA" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0098EA" flood-opacity="0.5"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#crystal)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#crystal)" stroke-width="1" opacity="0.15"/>

  <g filter="url(#shadow)">
    <polygon points="256,100 340,200 340,320 256,400 172,320 172,200" fill="none" stroke="url(#crystal)" stroke-width="3" stroke-linejoin="round"/>

    <polygon points="256,100 340,200 256,180 172,200" fill="url(#crystal)" opacity="0.25"/>
    <polygon points="172,200 256,180 256,340 172,320" fill="url(#crystal)" opacity="0.15"/>
    <polygon points="340,200 256,180 256,340 340,320" fill="url(#crystal)" opacity="0.35"/>
    <polygon points="256,400 340,320 256,340 172,320" fill="url(#crystal)" opacity="0.2"/>
  </g>

  <g opacity="0.9">
    <text x="256" y="285" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" letter-spacing="4">TF</text>
  </g>

  <line x1="256" y1="100" x2="256" y2="60" stroke="url(#crystal)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="55" r="4" fill="#00D4AA" opacity="0.8"/>

  <circle cx="360" cy="150" r="2" fill="#00D4AA" opacity="0.4"/>
  <circle cx="152" cy="150" r="2" fill="#6C5CE7" opacity="0.4"/>
  <circle cx="380" cy="340" r="1.5" fill="#0098EA" opacity="0.3"/>
  <circle cx="132" cy="340" r="1.5" fill="#00D4AA" opacity="0.3"/>
</svg>
